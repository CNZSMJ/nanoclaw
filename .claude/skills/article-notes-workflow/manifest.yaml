# 路径与命名配置（用户可改）；Step 4 及图片落盘时读取
# 笔记名：{slug}.md。媒体名：{slug}_01、{slug}_02…（媒体直接在 assets_path 下，无子目录）
config:
  notes_path: /workspace/extra/obsidian/碎片阅读
  note_filename_format: "{slug}.md"
  assets_path: /workspace/extra/obsidian/碎片阅读/_attachments
  asset_filename_format: "{slug}_{index:02}.{ext}"
  index_file: /workspace/extra/obsidian/碎片阅读/index.md

# 主分类与标签：Step 4 加工时使用；group 的 CLAUDE.md 有定义时优先用其约定
categories:
  tech: "工程、工具、API、基础设施"
  product: "产品、UX、路线图"
  research: "论文、调研、行业报告"
  tutorial: "教程、指南、步骤"
  biz: "商业、战略、增长"
  other: "以上都不适用时"

tag_rules:
  style: "小写、连字符"
  min_tags: 3
  max_tags: 8
